<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Arc Sentinel</title>
<style>
  /*
    Adapted from the Arc Sentinel artifact for a small frameless always-on-top
    window (see widget/wake_widget_daemon.py) instead of a browser page — no
    page-level backdrop/vignette, the widget IS the window. Rings are drawn as
    sparse dashed arcs (not full circles) to match the fragmented reactor-ring
    look of the main JARVIS HUD; --accent is overridden at load time from the
    daemon's ?accent= query param so it tracks whatever colour the user set
    in JARVIS's own Customise panel instead of a fixed blue.
  */
  @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

  :root{
    --bg:        #070c16;
    --bg-panel:  #0c1626;
    --bg-panel2: #0a1220;
    --line:      #1c2e47;
    --text:      #e3ecf7;
    --text-dim:  #7690ad;
    --text-faint:#48608a;
    --accent:    #00d4ff;
    --accent-2:  #7fe4ff;
    --accent-soft: rgba(0,212,255,.16);
    --accent-dim:  #007a99;
    /* Fixed semantic colours — mic/interrupt state, same as ui.py's C.GREEN /
       C.RED, which stay fixed regardless of the chosen accent in the real app. */
    --green:     #00ff88;
    --green-dim: #00aa55;
    --red:       #ff3355;
    --red-dim:   #b3243c;
    --font-display: 'Rajdhani', 'Segoe UI', sans-serif;
    --font-mono: 'JetBrains Mono', 'Consolas', monospace;
  }

  *{ box-sizing: border-box; }
  html, body{ width: 100%; height: 100%; margin: 0; }

  body{
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-display);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }

  .widget{
    position: relative;
    width: 100%;
    height: 100%;
    /* Two stacked gradients rather than color-mix() (unsupported on older
       WebView2 runtimes): an accent-tinted glow layered over the same
       neutral panel gradient the rest of the widget uses. */
    background:
      radial-gradient(120% 140% at 50% -10%, var(--accent-soft) 0%, transparent 46%),
      radial-gradient(120% 140% at 50% -10%, #101d33 0%, var(--bg-panel) 46%, var(--bg-panel2) 100%);
    border: 1px solid var(--line);
    padding: 16px 20px 18px;
    display: flex;
    flex-direction: column;
  }

  .eyebrow{
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: .1em;
    color: var(--text-faint);
    margin-bottom: 12px;
    -webkit-app-region: drag;
  }
  .eyebrow .id{ display:flex; align-items:center; gap:6px; }
  .eyebrow .dot{
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px 1px var(--accent-soft);
    animation: dotpulse 1.8s ease-in-out infinite;
  }
  @keyframes dotpulse{ 0%,100%{opacity:1} 50%{opacity:.4} }

  .close-btn{
    -webkit-app-region: no-drag;
    background: transparent; border: none; color: var(--text-faint);
    font-family: var(--font-mono); font-size: 13px; cursor: pointer;
    padding: 2px 6px; line-height: 1;
  }
  .close-btn:hover{ color: var(--red); }

  .radar-wrap{
    position: relative;
    width: 172px;
    height: 172px;
    margin: 0 auto 12px;
    flex-shrink: 0;
  }

  .rings-svg{ position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .arc{ fill: none; stroke: var(--accent); }
  .a1{ stroke-width: 1;   stroke-dasharray: 16 12 5 20 24 7;  opacity: .3;  }
  .a2{ stroke-width: 1;   stroke-dasharray: 34 16 9 26;       opacity: .4;  transform: rotate(35deg);  transform-origin: 100px 100px; }
  .a3{ stroke-width: 1.4; stroke-dasharray: 11 9 32 15 7 22;  opacity: .5;  transform: rotate(-70deg); transform-origin: 100px 100px; }
  .a4{ stroke-width: 1;   stroke-dasharray: 7 11 22 9;        opacity: .6;  transform: rotate(160deg); transform-origin: 100px 100px; }

  .sweep{
    position: absolute; inset: 0; border-radius: 50%;
    background: conic-gradient(from 0deg,
      transparent 0deg, transparent 268deg,
      var(--accent-soft) 300deg, var(--accent) 328deg,
      var(--accent-2) 336deg, transparent 337deg);
    opacity: .8;
    animation: spin 2.6s linear infinite;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  .blip{
    position: absolute; width: 4px; height: 4px; border-radius: 50%;
    background: var(--accent-2); opacity: 0;
    box-shadow: 0 0 6px 1px var(--accent-soft);
    animation: blip 3.8s ease-in-out infinite;
  }
  .blip.b1{ top: 38%; left: 66%; animation-delay: .3s; }
  .blip.b2{ top: 62%; left: 34%; animation-delay: 1.6s; }
  .blip.b3{ top: 30%; left: 40%; animation-delay: 2.7s; }
  @keyframes blip{
    0%,100%{ opacity: 0; transform: scale(.6); }
    12%{ opacity: 1; transform: scale(1); }
    30%{ opacity: 0; transform: scale(.6); }
  }

  .core{ position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .core-disc{
    width: 82px; height: 82px; border-radius: 50%;
    background: radial-gradient(circle at 50% 32%, var(--accent-dim) 0%, var(--bg-panel2) 72%);
    border: 1px solid var(--accent);
    box-shadow: 0 0 26px -4px var(--accent-soft), inset 0 0 20px -6px var(--accent-soft);
    display: flex; align-items: center; justify-content: center;
  }
  .core-dot{
    width: 11px; height: 11px; border-radius: 50%;
    background: var(--accent-2);
    box-shadow: 0 0 18px 4px var(--accent-soft);
    animation: pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{ transform: scale(1); } 50%{ transform: scale(1.16); } }

  .halo{
    position: absolute; inset: -14px; border-radius: 50%;
    background: radial-gradient(circle, var(--accent-soft) 0%, transparent 68%);
    pointer-events: none;
  }

  .status{ text-align: center; margin-bottom: 12px; }
  .status-label{
    font-weight: 600; font-size: 16px; letter-spacing: .06em;
    text-transform: uppercase; color: var(--text);
  }
  .status-line{
    font-family: var(--font-mono); font-size: 10px; color: var(--text-faint);
    margin-top: 3px; letter-spacing: .02em;
  }

  /* ── controls — same two-row layout & fixed semantic colours as the main
     JARVIS window's own INTERRUPT / MICROPHONE buttons ────────────────── */
  .controls{ margin-top: auto; display: flex; flex-direction: column; gap: 7px; }

  button.ctl{
    -webkit-app-region: no-drag;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 12px;
    letter-spacing: .06em;
    text-transform: uppercase;
    border-radius: 6px;
    padding: 9px 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--text-dim);
    transition: all .15s ease;
  }
  button.ctl:disabled{ opacity: .4; cursor: not-allowed; }
  button.ctl:focus-visible{ outline: 2px solid var(--accent); outline-offset: 2px; }

  #interruptBtn.live{
    background: rgba(255,51,85,.12); color: var(--red); border-color: var(--red-dim);
  }
  #interruptBtn.live:hover:not(:disabled){ background: rgba(255,51,85,.2); border-color: var(--red); }

  #micBtn.on{
    background: rgba(0,255,136,.1); color: var(--green); border-color: var(--green-dim);
  }
  #micBtn.on:hover:not(:disabled){ background: rgba(0,255,136,.16); border-color: var(--green); }
  #micBtn.off{
    background: rgba(255,51,85,.1); color: var(--red); border-color: var(--red-dim);
  }
  #micBtn.off:hover:not(:disabled){ background: rgba(255,51,85,.16); border-color: var(--red); }

  @media (prefers-reduced-motion: reduce){
    .sweep{ animation: none; opacity: .6; }
    .core-dot, .blip, .eyebrow .dot{ animation: none !important; }
  }
</style>
</head>
<body>
  <div class="widget">
    <div class="eyebrow">
      <span class="id"><span class="dot"></span>SENTINEL // AWAKE</span>
      <button class="close-btn" onclick="window.pywebview && window.pywebview.api.say_bye()" title="Dismiss">✕</button>
    </div>

    <div class="radar-wrap">
      <div class="halo"></div>
      <svg class="rings-svg" viewBox="0 0 200 200">
        <circle class="arc a1" cx="100" cy="100" r="96"/>
        <circle class="arc a2" cx="100" cy="100" r="80"/>
        <circle class="arc a3" cx="100" cy="100" r="62"/>
        <circle class="arc a4" cx="100" cy="100" r="44"/>
      </svg>
      <div class="sweep"></div>
      <div class="blip b1"></div><div class="blip b2"></div><div class="blip b3"></div>
      <div class="core"><div class="core-disc"><div class="core-dot"></div></div></div>
    </div>

    <div class="status">
      <div class="status-label">Listening</div>
      <div class="status-line">say "bye jarvis" to dismiss</div>
    </div>

    <div class="controls">
      <button class="ctl" id="interruptBtn" title="Stop JARVIS mid-speech">⚠ INTERRUPT</button>
      <button class="ctl" id="micBtn" title="Mute / unmute the JARVIS microphone">🎙 MICROPHONE</button>
    </div>
  </div>

<script>
  // ── Accent colour: passed by the daemon as ?accent=#rrggbb (read from
  //    JARVIS's own config/api_keys.json ui_color) so this matches whatever
  //    theme the user picked in Customise, instead of a fixed blue.
  (function applyAccent(){
    const accent = new URLSearchParams(location.search).get('accent');
    if (!accent || !/^#[0-9a-fA-F]{6}$/.test(accent)) return;
    const hexToRgb = h => [1,3,5].map(i => parseInt(h.slice(i, i+2), 16));
    const mix = (h, target, amt) => {
      const [r,g,b] = hexToRgb(h), [tr,tg,tb] = target;
      const c = v => Math.max(0, Math.min(255, Math.round(v)));
      return `#${[c(r+(tr-r)*amt), c(g+(tg-g)*amt), c(b+(tb-b)*amt)]
        .map(v => v.toString(16).padStart(2,'0')).join('')}`;
    };
    const root = document.documentElement.style;
    const [r,g,b] = hexToRgb(accent);
    root.setProperty('--accent', accent);
    root.setProperty('--accent-2', mix(accent, [255,255,255], 0.45));
    root.setProperty('--accent-dim', mix(accent, [0,0,0], 0.45));
    root.setProperty('--accent-soft', `rgba(${r},${g},${b},0.16)`);
  })();

  // ── Live mic/interrupt controls — talk to JARVIS's own loopback control
  //    channel (core/local_control.py), started by the running JARVIS
  //    process itself. Only reachable from this machine, so no token needed.
  const CONTROL = 'http://127.0.0.1:8765';
  const micBtn = document.getElementById('micBtn');
  const interruptBtn = document.getElementById('interruptBtn');
  const statusLine = document.querySelector('.status-line');
  let reachable = false;

  function renderState(s) {
    reachable = true;
    micBtn.disabled = false;
    interruptBtn.disabled = false;
    if (s.muted) {
      micBtn.className = 'ctl off';
      micBtn.textContent = '🔇 MIC MUTED';
    } else {
      micBtn.className = 'ctl on';
      micBtn.textContent = '🎙 MIC ACTIVE';
    }
    interruptBtn.className = s.speaking ? 'ctl live' : 'ctl';
    statusLine.textContent = s.speaking
      ? 'JARVIS is speaking — tap INTERRUPT to cut in'
      : 'say "bye jarvis" to dismiss';
  }

  function renderOffline() {
    reachable = false;
    micBtn.disabled = true;
    interruptBtn.disabled = true;
    micBtn.className = 'ctl';
    micBtn.textContent = '⛔ JARVIS OFFLINE';
    interruptBtn.className = 'ctl';
    statusLine.textContent = 'JARVIS is not running';
  }

  async function pollStatus() {
    try {
      const r = await fetch(CONTROL + '/status');
      renderState(await r.json());
    } catch (e) {
      renderOffline();
    }
  }

  micBtn.addEventListener('click', async () => {
    if (!reachable) return;
    try { await fetch(CONTROL + '/mute', { method: 'POST' }); } catch (e) {}
    pollStatus();
  });
  interruptBtn.addEventListener('click', async () => {
    if (!reachable) return;
    try { await fetch(CONTROL + '/interrupt', { method: 'POST' }); } catch (e) {}
    pollStatus();
  });

  pollStatus();
  setInterval(pollStatus, 900);
</script>
</body>
</html>
